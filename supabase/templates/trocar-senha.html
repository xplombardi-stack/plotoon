<!DOCTYPE html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#0a0b10;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0b10;padding:32px 12px;font-family:Inter,Arial,Helvetica,sans-serif;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#12151c;border:1px solid #232836;border-radius:18px;">
            <tr>
              <td style="padding:32px 32px 8px;">
                <img src="https://plotoon.netlify.app/email/logo-plotoon.png" width="160" height="32" alt="Plotoon" style="display:block;border:0;outline:none;">
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0;">
                <h1 style="margin:0;font-size:24px;line-height:1.25;color:#f2f4f7;font-weight:800;">Vamos criar uma senha nova</h1>
                <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#a7aebb;">Recebemos um pedido pra trocar a senha da sua conta no Plotoon. Clique no botão abaixo pra criar uma senha nova.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 32px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ff8a3d;color:#1b0e04;font-size:16px;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:12px;">Criar senha nova</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#808999;">Se não foi você que pediu, é só ignorar este e-mail. Sua senha continua a mesma.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#5f6775;font-family:Inter,Arial,Helvetica,sans-serif;">© Plotoon · Historinhas com boneco 3D</p>
        </td>
      </tr>
    </table>
  </body>
</html>
